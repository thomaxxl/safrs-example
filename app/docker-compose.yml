services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      CONFIG_MODULE: config/base.py
      FLASK_APP: app:create_app
      FLASK_ENV: development
      DB_HOST: db
      DB_NAME: safrs
      DB_USER: postgres
      DB_PWD: password
      PYTHONPATH: "${PYTHONPATH}:/app/safrs:/app/src/safrs"
      SWAGGER_HOST: 127.0.0.1
      SWAGGER_PORT: 1237
      SAFRS_BACKEND: fastapi
    ports:
      - "1237:80"
    volumes:
      - ..:/app
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: safrs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
