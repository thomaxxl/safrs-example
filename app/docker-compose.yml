services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONFIG_MODULE: /workspace/app/config/base.py
      FLASK_APP: app:create_app
      FLASK_ENV: development
      DB_HOST: db
      DB_NAME: safrs
      DB_USER: postgres
      DB_PWD: password
      PYTHONPATH: "/workspace"
      SWAGGER_HOST: 127.0.0.1
      SWAGGER_PORT: 1237
    ports:
      - "1237:80"
    volumes:
      - .:/workspace/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: safrs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safrs"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
