[pytest]
testpaths = tests
addopts = -v
markers =
    contract: Contract verification tests driven by runtime-discovered OpenAPI/Swagger specs
    parity: Swagger2/OpenAPI3 parity checks
    slow: Long-running integration tests
# Suppress spammy warnings from flask_sqlalchemy and safrs respectively
filterwarnings =
    ignore::sqlalchemy.exc.SADeprecationWarning
    #ignore::yaml.YAMLLoadWarning
